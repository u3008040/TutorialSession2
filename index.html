<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutorial 2 · From a Messy Export to a Fleet</title>
<meta name="description" content="INE 315 Week 10: sensors, conversion functions and try/except, one card at a time.">
<style>
:root{
  --bg:#faf9f7; --panel:#ffffff; --panel-2:#f3f2ef; --ink:#1b1b1a; --ink-2:#3d3d3a; --ink-3:#77766f;
  --line:#e0dfda; --line-soft:#eceae5; --code-bg:#f7f6f3; --com:#8a8880;
  --red:#A93226; --red-soft:rgba(169,50,38,.09); --blue:#2874A6; --blue-soft:rgba(40,116,166,.10);
  --ok:#1e7a4b; --ok-soft:rgba(30,122,75,.10); --bad:#b0382a; --bad-soft:rgba(176,56,42,.09);
  --amber:#c77a00;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16161a; --panel:#1e1e23; --panel-2:#26262c; --ink:#f0efea; --ink-2:#d2d1ca; --ink-3:#9a998f;
    --line:#33333a; --line-soft:#2a2a30; --code-bg:#1a1a20; --com:#807f76;
    --red:#D0655A; --red-soft:rgba(208,101,90,.14); --blue:#5BA3D6; --blue-soft:rgba(91,163,214,.14);
    --ok:#4cb07a; --ok-soft:rgba(76,176,122,.14); --bad:#e06a5a; --bad-soft:rgba(224,106,90,.14);
    --amber:#e0a94a;
  }
}
:root[data-theme="dark"]{
  --bg:#16161a; --panel:#1e1e23; --panel-2:#26262c; --ink:#f0efea; --ink-2:#d2d1ca; --ink-3:#9a998f;
  --line:#33333a; --line-soft:#2a2a30; --code-bg:#1a1a20; --com:#807f76;
  --red:#D0655A; --red-soft:rgba(208,101,90,.14); --blue:#5BA3D6; --blue-soft:rgba(91,163,214,.14);
  --ok:#4cb07a; --ok-soft:rgba(76,176,122,.14); --bad:#e06a5a; --bad-soft:rgba(224,106,90,.14);
  --amber:#e0a94a;
}
*{box-sizing:border-box}
html,body{margin:0; padding:0}
body{background:var(--bg); color:var(--ink); font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; padding-bottom:86px}
code,pre,kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
code{background:var(--panel-2); border-radius:5px; padding:1px 5px; font-size:.88em}
kbd{background:var(--panel-2); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; font-size:.82em}
b{font-weight:700}
.top{position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--bg) 88%,transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.in{max-width:1180px; margin:0 auto; padding:9px 16px; display:flex; gap:12px; align-items:center}
.brand{font-weight:700; font-size:.9rem; white-space:nowrap}
.brand span{color:var(--red)}
.chips{display:flex; gap:6px; overflow-x:auto; flex:1; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line); background:var(--panel); color:var(--ink-2); border-radius:99px; padding:4px 12px;
  font:inherit; font-size:.8rem; white-space:nowrap; cursor:pointer}
.chip.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.chip.sep{cursor:default; border-style:dashed; color:var(--ink-3); font-weight:700; background:transparent}
.tools{display:flex; gap:8px; align-items:center}
.tbtn{border:1px solid var(--line); background:var(--panel); color:var(--ink-2); border-radius:8px; padding:4px 10px; font:inherit; font-size:.78rem; cursor:pointer}
.timer{font-variant-numeric:tabular-nums; font-weight:700; font-size:.85rem; color:var(--ink-3); display:none; cursor:pointer}
.timer.on{display:inline}
.timer.up{color:var(--red)}
main{max-width:1180px; margin:0 auto; padding:22px 16px 0}
.card{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:26px 28px; animation:in .18s ease-out}
@keyframes in{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
.ctype{display:flex; gap:10px; align-items:center; font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); font-weight:700; margin-bottom:8px}
.pill{border-radius:99px; padding:3px 10px; background:var(--panel-2); color:var(--ink-2)}
.pill.blue{background:var(--blue-soft); color:var(--blue)}
.pill.green{background:var(--ok-soft); color:var(--ok)}
.pill.red{background:var(--red-soft); color:var(--red)}
h1{font-size:clamp(1.7rem,3.6vw,2.3rem); line-height:1.15; margin:.1em 0 .3em}
h2{font-size:clamp(1.25rem,2.6vw,1.7rem); line-height:1.2; margin:.1em 0 .45em}
h3{font-size:1rem; margin:.2em 0 .3em}
p.lead{color:var(--ink-2); margin:.2em 0 1em}
.two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:26px}
.two.wide-left{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media (max-width:820px){ .two,.two.wide-left{grid-template-columns:minmax(0,1fr); gap:16px} }
ul.points{margin:.2em 0; padding:0; list-style:none}
ul.points li{position:relative; padding-left:1.7em; margin:.55em 0}
ul.points li::before{counter-increment:p; content:counter(p); position:absolute; left:0; top:.15em; width:1.15em; height:1.15em;
  border-radius:50%; background:var(--red-soft); color:var(--red); font-size:.72em; font-weight:800; display:grid; place-items:center}
ul.points{counter-reset:p}
.notebox{margin-top:14px; background:var(--panel-2); border-radius:12px; padding:11px 15px; font-size:.93rem}
.tag{font-size:.66rem; font-weight:800; letter-spacing:.08em; border-radius:6px; padding:2px 7px; margin-left:8px; vertical-align:middle;
  background:var(--panel-2); color:var(--ink-3); border:1px solid var(--line)}
.tag.PYTHON{background:var(--red-soft); color:var(--red); border-color:var(--red)}
.tag.IDEA{background:var(--blue-soft); color:var(--blue); border-color:var(--blue)}
.tag.GIVEN{background:var(--panel-2); color:var(--ink-3); border-color:var(--line)}
pre.code{margin:0; background:var(--code-bg); border:1px solid var(--line); border-radius:13px; padding:12px 0; font-size:.9rem; line-height:1.65; overflow-x:auto}
pre.code.big{font-size:.95rem}
.ln{display:block; padding:0 16px 0 0; white-space:pre}
.ln .no{display:inline-block; width:2.4em; padding-right:.9em; text-align:right; color:var(--ink-3); opacity:.6; user-select:none}
.ln.click{cursor:pointer}
.ln.click:hover{background:var(--panel-2)}
.ln.cur{background:var(--blue-soft)}
.ln.right{background:var(--ok-soft)} .ln.wrong{background:var(--bad-soft)}
.tk-kw{color:var(--red); font-weight:700} .tk-str{color:var(--blue)} .tk-num{color:var(--amber)}
.tk-com{color:var(--com); font-style:italic} .tk-fn{color:var(--blue)}
.opts{display:grid; gap:9px}
.opt{display:flex; gap:11px; align-items:flex-start; text-align:left; border:1px solid var(--line); background:var(--panel);
  border-radius:12px; padding:10px 13px; font:inherit; cursor:pointer; color:var(--ink)}
.opt:hover{border-color:var(--ink-3)}
.opt .l{font-weight:800; color:var(--ink-3)}
.opt pre{margin:0; font-size:.86rem; white-space:pre-wrap; word-break:break-word}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.right .l{color:var(--ok)}
.opt.dim{opacity:.45}
.reveal{max-height:0; overflow:hidden; opacity:0; transition:max-height .25s ease,opacity .25s ease}
.reveal.show{max-height:2200px; opacity:1; margin-top:14px}
.cap{font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); font-weight:800; margin:10px 0 5px}
pre.out{margin:0; background:var(--panel-2); border:1px solid var(--line); border-radius:11px; padding:10px 14px;
  font-size:.9rem; white-space:pre; overflow-x:auto; min-height:2.4em}
pre.out.empty{color:var(--ink-3); font-style:italic}
.ask{font-size:.9rem; color:var(--ink-3); margin-top:10px}
.btn{border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:10px; padding:7px 15px; font:inherit; cursor:pointer}
.btn.primary{background:var(--red); border-color:var(--red); color:#fff; font-weight:700}
.btn.blue{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700}
.btn.sm{padding:5px 11px; font-size:.86rem}
.btn:disabled{opacity:.45; cursor:default}
.row{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.stepinfo{font-size:.85rem; color:var(--ink-3)}
.note{background:var(--panel-2); border-left:3px solid var(--red); border-radius:0 10px 10px 0; padding:10px 14px; font-size:.94rem; min-height:3.2em}
table.vars{width:100%; border-collapse:collapse; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.86rem}
table.vars td{padding:4px 8px; border-bottom:1px dotted var(--line-soft)}
table.vars td:first-child{color:var(--ink-2); width:45%}
table.vars td:last-child{color:var(--red); font-weight:700}
table.vars tr.chg td{background:var(--red-soft)}
.frame{border:1px solid var(--line); border-radius:11px; padding:7px 9px; margin-bottom:9px; background:var(--panel)}
.frame .fh{font-size:.68rem; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3); font-weight:800; margin-bottom:3px}
.pz{display:grid; gap:6px; margin-top:8px; overflow-x:auto}
.pzl{display:flex; gap:10px; align-items:center; min-width:0; border:1px solid var(--line); border-radius:10px; padding:5px 10px; background:var(--panel)}
.pzl.ok{border-color:var(--ok); background:var(--ok-soft)} .pzl.no{border-color:var(--bad); background:var(--bad-soft)}
.pzl .ctl{display:flex; gap:4px}
.pzl .ctl button{width:26px; height:26px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); border-radius:7px; cursor:pointer; font-size:.8rem}
.pzl .txt{flex:1; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.88rem; white-space:pre}
.pzl .mark{font-weight:800; width:1em}
.fb{margin-top:10px; font-size:.95rem}
.errline{margin-top:12px; background:var(--bad-soft); border:1px solid var(--bad); border-radius:11px; padding:10px 14px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.88rem}
.cause{margin-top:12px; background:var(--panel-2); border-radius:12px; padding:12px 15px; font-size:.94rem}
.exp{margin-top:12px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px}
.exp .box{border-radius:11px; padding:8px 12px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.87rem; white-space:pre-wrap}
.exp .want{background:var(--ok-soft); border:1px solid var(--ok)}
.exp .got{background:var(--bad-soft); border:1px solid var(--bad)}
.exp .k{display:block; font-family:inherit; font-size:.66rem; letter-spacing:.07em; text-transform:uppercase; font-weight:800; color:var(--ink-3); margin-bottom:2px}
.cls{display:grid; gap:8px; margin-top:8px}
.clrow{display:flex; gap:10px; align-items:center; flex-wrap:wrap; border:1px solid var(--line); border-radius:11px; padding:8px 13px; background:var(--panel)}
.clrow.ok{border-color:var(--ok); background:var(--ok-soft)} .clrow.no{border-color:var(--bad); background:var(--bad-soft)}
.clrow .cli{flex:1; min-width:150px}
.clb{display:flex; gap:6px; flex-wrap:wrap}
.binb{font:inherit; font-size:.82rem; border:1px solid var(--line); background:var(--panel-2); color:var(--ink-2); border-radius:99px; padding:4px 12px; cursor:pointer}
.binb.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.clrow .mark{font-weight:800; width:1em}
.ftab{width:100%; border-collapse:collapse; font-size:.94rem; margin-top:10px}
.ftab td{padding:7px 10px; border-bottom:1px solid var(--line-soft); vertical-align:top}
.ftab{table-layout:fixed}
.ftab td:first-child{width:40%}
.ftab td:last-child{overflow-wrap:anywhere}
.ftab td:last-child{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--blue); font-size:.86rem}
.ftab th{text-align:left; font-size:.68rem; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); padding:4px 10px; border-bottom:1px solid var(--line)}
.etab,.sum{width:100%; border-collapse:collapse; font-size:.94rem}
.etab th,.sum th{text-align:left; font-size:.68rem; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); padding:6px 9px; border-bottom:1px solid var(--line)}
.etab td,.sum td{padding:8px 9px; border-bottom:1px solid var(--line-soft); vertical-align:top}
.etab td:last-child{color:var(--ink-3)}
.sum td:first-child{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--blue)}
.sum td{overflow-wrap:anywhere}
.chatbar{display:flex; gap:12px; align-items:center; background:var(--panel-2); border-radius:12px; padding:11px 15px; margin-top:16px; font-size:.93rem}
.exlist{display:grid; grid-template-columns:minmax(0,1fr); gap:10px; margin-top:6px}
.ex{border:1px solid var(--line); border-radius:12px; padding:11px 15px; background:var(--panel); min-width:0}
.ex .h{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.ex .id{font-weight:800; color:var(--red)}
.ex .kind{font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; font-weight:800; border-radius:6px; padding:2px 7px; background:var(--panel-2); color:var(--ink-3)}
.ex .task{margin:6px 0 0; font-size:.94rem; color:var(--ink-2)}
.star{font-size:.72rem; color:var(--amber); font-weight:700}
.session{min-height:58vh; display:flex; flex-direction:column; justify-content:center}
.banner{display:inline-block; font-size:.78rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; background:var(--red); color:#fff; border-radius:99px; padding:4px 14px; margin-bottom:12px}
.banner.s2{background:var(--blue)}
.recap{background:var(--panel-2); border-radius:12px; padding:12px 16px; margin:10px 0 16px; font-size:.95rem}
.demolist{display:grid; gap:8px; margin-top:6px}
.demolist div{border:1px solid var(--line); border-radius:10px; padding:8px 12px; background:var(--panel)}
.rhythm{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr)); gap:10px; margin-top:18px}
.rh{border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--panel)}
.rh .k{font-size:.7rem; font-weight:800; color:var(--red)}
.rh .t{font-weight:700; font-size:.95rem}
.rh .d{font-size:.84rem; color:var(--ink-3)}
.hint{font-size:.83rem; color:var(--ink-3); margin-top:6px}
.tasks{margin:10px 0 0; padding-left:1.2em; font-size:.95rem}
.tasks li{margin:5px 0}
.livecode{margin:0; background:var(--code-bg); border:1px solid var(--line); border-radius:12px; padding:11px 15px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.86rem; white-space:pre-wrap; word-break:break-word; line-height:1.6}
.livecode .res{color:var(--red); font-weight:700}
.livecode .cm{color:var(--com); font-style:italic}
.livecode .on{color:var(--ok); font-weight:700}
/* --- live widgets --- */
.panelbox{border:1px solid var(--line); border-radius:14px; padding:12px 14px; background:var(--panel); min-width:0}
.panelbox h4{margin:0 0 8px; font-size:.95rem}
.panelbox.bad{border-color:var(--bad)}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; margin:6px 0 12px}
.push{border:1px solid var(--line); border-radius:12px; padding:9px 14px; font:inherit; font-weight:700; font-size:.86rem;
  background:var(--panel-2); color:var(--ink-2); cursor:pointer; user-select:none}
.push.on{color:#fff}
.push.estop.on{background:var(--red); border-color:var(--red)}
.push.stop.on{background:var(--ink-3); border-color:var(--ink-3)}
.push.start.on{background:var(--ok); border-color:var(--ok)}
.lamp{display:flex; gap:10px; align-items:center; font-weight:700; font-size:.9rem}
.bulb{width:30px; height:30px; border-radius:50%; border:2px solid var(--line); background:var(--panel-2)}
.bulb.lit{background:var(--amber); border-color:var(--amber); box-shadow:0 0 14px var(--amber)}
.codeline{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.83rem; padding:2px 6px; border-radius:6px; white-space:pre; overflow-x:auto}
#chain,#steps{overflow-x:auto}
.codeline.hit{background:var(--blue-soft)}
.codeline.dead{opacity:.4}
.sl{display:grid; grid-template-columns:6.4em minmax(0,1fr) 4em; gap:10px; align-items:center; margin:8px 0; font-size:.9rem}
.sl input[type=range]{width:100%; accent-color:var(--blue)}
.sl b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; text-align:right}
.tin{display:grid; grid-template-columns:6.4em minmax(0,1fr); gap:10px; align-items:center; margin:8px 0; font-size:.9rem}
.tin input[type=text],.tin input[type=number]{font:inherit; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.9rem;
  padding:6px 10px; border:1px solid var(--line); border-radius:9px; background:var(--panel-2); color:var(--ink); width:100%}
.console{background:#14141a; color:#e8e7e1; border-radius:12px; padding:10px 13px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.82rem; line-height:1.55; height:210px; overflow-y:auto; border:1px solid var(--line)}
.console .t{color:#8fb7d8} .console .m{color:#e8e7e1} .console .me{color:#f0b429; font-weight:700} .console .sys{color:#8a8880; font-style:italic}
svg.dg{display:block; width:100%; height:auto}
svg.dg .bx{fill:var(--panel-2); stroke:var(--line); stroke-width:1.5}
svg.dg .bx.acc{fill:var(--red-soft); stroke:var(--red)}
svg.dg .bx.b2{fill:var(--blue-soft); stroke:var(--blue)}
svg.dg .tx{fill:var(--ink); font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
svg.dg .sm{fill:var(--ink-3); font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
svg.dg .ar{stroke:var(--ink-3); stroke-width:1.6; fill:none; marker-end:url(#ah)}
.nav{position:fixed; left:0; right:0; bottom:0; background:color-mix(in srgb,var(--bg) 92%,transparent); backdrop-filter:blur(8px); border-top:1px solid var(--line); z-index:20}
.nav .in{justify-content:space-between}
.prog{height:3px; background:var(--red); width:0; transition:width .2s}
.navbtn{border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:10px; padding:9px 18px; font:inherit; font-weight:700; cursor:pointer}
.navbtn.next{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.navbtn:disabled{opacity:.35; cursor:not-allowed}
#where{font-size:.82rem; color:var(--ink-3); text-align:center}

/* --- tutorial 2 live widgets --- */
.pick{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}
.pick button{border:1px solid var(--line); background:var(--panel); color:var(--ink-2); border-radius:99px;
  padding:4px 12px; font:inherit; font-size:.82rem; cursor:pointer}
.pick button.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.clsbox{border:1px solid var(--line); border-radius:12px; padding:9px 12px; margin:6px 0; background:var(--panel-2)}
.clsbox.found{border-color:var(--ok); background:var(--ok-soft)}
.clsbox.looked{border-color:var(--blue); background:var(--blue-soft)}
.clsbox .hd{font-weight:700; font-size:.9rem; margin-bottom:3px}
.clsbox .ml{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.8rem; color:var(--ink-3)}
.clsbox .ml b{color:var(--ink)}
.updown{text-align:center; color:var(--ink-3); font-size:.8rem; margin:-2px 0}
.bar{height:16px; border-radius:99px; background:var(--panel-2); border:1px solid var(--line); overflow:hidden; margin:8px 0 4px}
.bar span{display:block; height:100%; background:var(--blue); transition:width .18s}
.bar span.full{background:var(--bad)}
.boxes{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr)); gap:7px; margin-top:8px}
.boxb{border:1px solid var(--line); border-radius:10px; padding:7px 10px; background:var(--panel); font-size:.82rem;
  text-align:left; cursor:pointer; font-family:inherit; color:var(--ink); min-width:0}
.boxb small{display:block; color:var(--ink-3)}
.boxb.on{border-color:var(--ok); background:var(--ok-soft)}
.boxb.no{border-color:var(--bad); background:var(--bad-soft)}
.boxb:disabled{opacity:.45; cursor:default}
.stoprow{display:flex; gap:8px; align-items:center; margin:5px 0; font-size:.88rem}
.stoprow input{accent-color:var(--blue)}
.stoprow .km{margin-left:auto; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--ink-3)}

/* --- tutorial 3: fill and marks cards --- */
pre.code.fillcode{padding:14px 0; line-height:2.15}
input.bk{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.86rem;
  background:var(--panel); color:var(--ink); border:none; border-bottom:2px solid var(--blue);
  border-radius:4px 4px 0 0; padding:2px 6px 5px; margin:0 2px; min-width:3.2em; max-width:100%;
  line-height:1.25}
input.bk:focus{outline:none; background:var(--blue-soft)}
input.bk.good{border-bottom-color:var(--ok); background:var(--ok-soft)}
input.bk.bad{border-bottom-color:var(--bad); background:var(--bad-soft)}
.bn{font-size:.62rem; font-weight:800; color:var(--ink-3); vertical-align:super; margin-left:1px}
.qbox{background:var(--panel-2); border-left:3px solid var(--red); border-radius:0 10px 10px 0;
  padding:11px 15px; margin-bottom:14px; font-size:.95rem}
table.scheme{width:100%; border-collapse:collapse; font-size:.9rem}
table.scheme td{border-bottom:1px solid var(--line-soft); padding:7px 9px; vertical-align:top}
table.scheme td:first-child{width:3.2em; font-weight:800; color:var(--ok); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
table.scheme tr.z td:first-child{color:var(--bad)}
.pick{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}
.pick button{border:1px solid var(--line); background:var(--panel); color:var(--ink-2); border-radius:99px;
  padding:4px 14px; font:inherit; font-size:.85rem; cursor:pointer; font-variant-numeric:tabular-nums}
.pick button.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}

/* --- tutorial 2: the raw-table widgets --- */
table.raw{border-collapse:collapse; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.78rem; white-space:nowrap}
table.raw th{text-align:left; padding:5px 9px; border-bottom:1px solid var(--line); color:var(--ink-3);
  font-weight:800; font-size:.72rem; cursor:pointer; user-select:none}
table.raw th:hover{color:var(--ink)}
table.raw th.sel{color:var(--bg); background:var(--ink); border-radius:6px 6px 0 0}
table.raw td{padding:3px 9px; border-bottom:1px dotted var(--line-soft)}
table.raw td.sel{background:var(--blue-soft)}
table.raw td.bad{background:var(--bad-soft); color:var(--bad); font-weight:700}
table.raw th.n,table.raw td.n{color:var(--ink-3); opacity:.55; text-align:right; padding-right:4px; cursor:default}
table.raw td .na{color:var(--ink-3); font-style:italic}
table.raw tr.gone td{opacity:.35; text-decoration:line-through}
table.raw td.fate{text-decoration:none; color:var(--bad); font-weight:700; font-size:.72rem}
table.raw tr.gone td.fate{opacity:1; text-decoration:none}
.clsbox{border:1px solid var(--line); border-radius:12px; padding:9px 12px; margin:6px 0; background:var(--panel-2)}
.clsbox.found{border-color:var(--ok); background:var(--ok-soft)}
.clsbox.looked{border-color:var(--bad); background:var(--bad-soft)}
.clsbox .hd{font-weight:700; font-size:.9rem; margin-bottom:3px}
.clsbox .ml{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.8rem; color:var(--ink-3)}
.clsbox .ml b{color:var(--ink)}
.updown{text-align:center; color:var(--ink-3); font-size:.8rem; margin:-2px 0}
.stoprow{display:flex; gap:8px; align-items:center; margin:5px 0; font-size:.88rem;
  border:1px solid var(--line); border-radius:10px; padding:6px 11px; background:var(--panel)}
.stoprow input{accent-color:var(--blue)}
.stoprow .km{margin-left:auto; font-size:.76rem; color:var(--ink-3)}
svg.dg{display:block; width:100%; height:auto}
svg.dg .bx{fill:var(--panel-2); stroke:var(--line); stroke-width:1.5}
svg.dg .bx.acc{fill:var(--red-soft); stroke:var(--red)}
svg.dg .bx.b2{fill:var(--blue-soft); stroke:var(--blue)}
svg.dg .tx{fill:var(--ink); font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
svg.dg .sm{fill:var(--ink-3); font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
svg.dg .ar{stroke:var(--ink-3); stroke-width:1.6; fill:none}
.livecode{margin:0; background:var(--code-bg); border:1px solid var(--line); border-radius:12px; padding:11px 15px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.86rem; white-space:pre-wrap;
  word-break:break-word; line-height:1.6}
.livecode .res{color:var(--red); font-weight:700}
.livecode .cm{color:var(--com); font-style:italic}
.panelbox{border:1px solid var(--line); border-radius:14px; padding:12px 14px; background:var(--panel); min-width:0}
.tasks{margin:10px 0 0; padding-left:1.2em; font-size:.95rem}
.tasks li{margin:5px 0}
/* --- the statement builder: click a shaded word to change it --- */
.expr{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.84rem;
  line-height:2.1; margin:2px 0 4px; word-break:break-word}
.expr .lit{color:var(--ink-3)}
.expr .cont{letter-spacing:.14em}
.expr .tok{font:inherit; cursor:pointer; border:1px solid var(--blue); background:var(--blue-soft);
  color:var(--ink); border-radius:7px; padding:2px 7px; margin:0 2px}
.expr .tok:hover{background:var(--ink); color:var(--bg); border-color:var(--ink)}
table.raw tr.hit td{background:var(--ok-soft)}
table.raw td.keep{color:var(--ok); font-weight:700; font-size:.72rem}
table.ser{border-collapse:collapse; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.82rem; margin-top:2px}
table.ser td{padding:2px 14px 2px 0}
table.ser td.v{font-weight:700; text-align:right}
table.ser tr.dt td{color:var(--ink-3); font-size:.72rem; padding-top:5px}
.wline{display:flex; gap:10px; align-items:baseline; margin:3px 0}
.wline code{flex:0 0 3.6em; text-align:right; color:var(--blue); font-weight:700}
@media (max-width:700px){ .brand{display:none} .card{padding:18px 15px; border-radius:14px} main{padding:14px 10px 0} }
</style>

een doing with lists and strings."], "code": "import pandas as pd\n\nraw = pd.read_csv(\"shipments_export.csv\")\n\nprint(len(raw))              # how many rows\nprint(raw[\"weight_kg\"])      # one whole column\nprint(raw[\"weight_kg\"][0])   # one value out of it", "note": "<b>The file, the column names and the units are all <span class=\"tag GIVEN\">GIVEN<\/span>.<\/b> Nobody is examined on where the export came from. You are examined on what you do to it."}, {"kind": "live", "mode": "table", "title": "Look at the export, one column at a time", "tasks": ["Click <b>weight_kg<\/b>. What type is it, and why is that type wrong?", "Click <b>ref<\/b>. There are 12 rows — how many different references?", "Which column has values that <code>isna()<\/code> cannot see?"]}, {"kind": "predict", "question": "Add up the weights of twelve shipments. What happens?", "code": "import pandas as pd\n\nraw = pd.read_csv(\"shipments_export.csv\")\n\nprint(raw[\"weight_kg\"].sum())", "options": ["420135090026015003401350not recorded7801120", "TypeError: unsupported operand type(s) for +: 'int' and 'str'", "nan", "6020.0"], "explain": "<b>The column is text, so <code>+<\/code> glued the values end to end.<\/b> No error, no warning, and a number that is not a number. This is why the very first thing you do to a real file is look at the <b>types<\/b>, not at the values. <b>A total that looks absurd is lucky<\/b> — the dangerous version is a total that looks plausible.", "answer": 0, "output": "420135090026015003401350not recorded7801120"}, {"kind": "idea", "tag": "IDEA", "title": "Three things wrong with a real export", "points": ["<b>A number column that is text.<\/b> One value reads <code>not recorded<\/code>, so pandas made the whole column text and arithmetic stops working.", "<b>Rows with nothing in them.<\/b> Two shipments have no weight at all. They are not zero — they are <i>unknown<\/i>, and an unknown weight cannot be loaded onto anything.", "<b>A duplicate.<\/b> Twelve rows, eleven different references. Somebody exported the same shipment twice, and it will be counted twice in every total.", "<b>Each fault is one statement to fix.<\/b> That is the whole of today's first hour."], "fhead": ["the fault", "the statement that fixes it"], "formulas": [["text where a number belongs", "pd.to_numeric(col, errors=\"coerce\")"], ["rows with no value", "df.dropna(subset=[\"weight_kg\"])"], ["the same record twice", "df.drop_duplicates(subset=[\"ref\"])"], ["yes / no where True / False belongs", "df[\"chilled\"] == \"yes\""]], "note": "<b>The last one is <span class=\"tag GIVEN\">GIVEN<\/span> today<\/b> — it is on the demo so the objects in Part 2 get a real <code>True<\/code>, but it is not in the exercises."}]}, {"session": 1, "id": "P2", "short": "Cleaning", "title": "Cleaning, in three statements", "cards": [{"kind": "demo", "title": "Demo 1: what actually came out of the system", "code": "raw = pd.read_csv(\"shipments_export.csv\")\n\nprint(raw.head(4).to_string(index=False))\nprint()\nprint(\"rows:           \", len(raw))\nprint(\"missing weights:\", raw[\"weight_kg\"].isna().sum())\nprint(\"unique refs:    \", raw[\"ref\"].nunique())", "points": ["<code>head(4)<\/code> shows you the shape of the thing before you touch it. <b>Always look first.<\/b>", "<code>.isna().sum()<\/code> counts the blanks in a column: <code>isna()<\/code> gives a column of True/False, and <code>sum()<\/code> counts the Trues.", "<b><code>nunique()<\/code> is how you find duplicates<\/b> without hunting: twelve rows, eleven references, so one row is a repeat.", "<b>Notice what is missing from the count.<\/b> <code>not recorded<\/code> is not blank — it is a perfectly good piece of text, so <code>isna()<\/code> never sees it."], "output": "  ref destination weight_kg chilled booked_by\nS-101      Al Ain       420      no      Amal\nS-102    Fujairah      1350     yes     Bilal\nS-103       Dibba       900     yes      Sara\nS-104      Al Ain       260      no      Amal\n\nrows:            12\nmissing weights: 2\nunique refs:     11"}, {"kind": "fill", "title": "The three cleaning statements", "intro": "Three faults, three statements, in this order. <b>Each one hands back a new table<\/b>, which is why each one is assigned back to <code>df<\/code>.", "code": "df = pd.read_csv(\"shipments_export.csv\")\n\ndf[\"weight_kg\"] = pd.{{1}}(df[\"weight_kg\"], errors=\"coerce\")\ndf = df.{{2}}(subset=[\"weight_kg\"])\ndf = df.{{3}}(subset=[\"ref\"])\n\nprint(len(df), \"rows left\")", "blanks": [{"n": 1, "answer": "to_numeric", "also": [], "reject": {}, "hint": "Turn text into numbers. <code>errors=\"coerce\"<\/code> means <i>anything you cannot convert becomes blank<\/i>."}, {"n": 2, "answer": "dropna", "also": [], "reject": {}, "hint": "Throw away the rows whose weight is blank."}, {"n": 3, "answer": "drop_duplicates", "also": [], "reject": {}, "hint": "Keep one row per reference."}], "after": "<b>Order matters.<\/b> <code>to_numeric<\/code> has to run first, because it is what turns <code>not recorded<\/code> into a blank that <code>dropna<\/code> can then see. Run them the other way round and that row survives, and every later total is wrong.", "filled": "df = pd.read_csv(\"shipments_export.csv\")\n\ndf[\"weight_kg\"] = pd.to_numeric(df[\"weight_kg\"], errors=\"coerce\")\ndf = df.dropna(subset=[\"weight_kg\"])\ndf = df.drop_duplicates(subset=[\"ref\"])\n\nprint(len(df), \"rows left\")"}, {"kind": "bug", "title": "It ran, and nothing happened", "code": "df = pd.read_csv(\"shipments_export.csv\")\ndf[\"weight_kg\"] = pd.to_numeric(df[\"weight_kg\"], errors=\"coerce\")\n\ndf.dropna(subset=[\"weight_kg\"])\n\nprint(len(df), \"rows left\")", "line": 4, "cause": "<b>Almost every pandas method hands you a <i>new<\/i> table and leaves the old one alone.<\/b> Line 4 built a cleaned table and then threw it away, because nothing caught it. No error, no warning — the cell runs green and the data is untouched. <b>If a line starts with <code>df.<\/code> and has no <code>=<\/code> in front of it, look hard at it.<\/b> This is the most common pandas mistake there is.", "expected": "9 rows left", "got": "12 rows left"}, {"kind": "live", "mode": "clean", "title": "Turn each cleaning step on and off", "tasks": ["Turn on only <b>drop_duplicates<\/b>. How many rows go? Why is it not one?", "Turn on <b>dropna<\/b> without <b>to_numeric<\/b>. How many rows does it remove, and which one survives that should not?", "Turn all three on, in order. What is the weight column's type now?"]}, {"kind": "classify", "title": "Hands back a new table, or hands back an answer?", "bins": ["hands back a new table", "hands back an answer"], "task": "Six calls from this hour. Which ones must be assigned to something, and which ones you can print?", "items": ["df.dropna(subset=[\"weight_kg\"])", "len(df)", "df.drop_duplicates(subset=[\"ref\"])", "df[\"weight_kg\"].isna().sum()", "df[df[\"weight_kg\"] > 800]", "df[\"ref\"].nunique()"], "after": "<b>Everything on the left is a fork in the road, not an instruction.<\/b> It builds a second table and hands it to you; if you do not catch it with <code>df = ...<\/code> or a new name, it is gone and your data never changed. Everything on the right is a fact about the table as it stands, and you can print it straight away.", "answers": [0, 1, 0, 1, 0, 1]}]}, {"session": 1, "id": "P3", "short": "The four", "title": "The four statements everything rests on", "cards": [{"kind": "idea", "tag": "PYTHON", "title": "Four statements, and you have pandas", "points": ["<b>A new column:<\/b> name it on the left, build it from existing columns on the right.", "<b>A filter:<\/b> one <code>df[ ... ]<\/code>, each condition in its own brackets, joined with <code>&amp;<\/code> or <code>|<\/code>.", "<b>Group and aggregate:<\/b> group by the <b>label<\/b> column, square-bracket the <b>number<\/b> column, then <code>.sum()<\/code> or <code>.mean()<\/code>.", "<b>Sort:<\/b> <code>.sort_values()<\/code> is smallest first. <b>Biggest first needs <code>ascending=False<\/code><\/b>, and that is the one everybody forgets."], "code": "df[\"tonnes\"] = df[\"weight_kg\"] / 1000\n\nheavy = df[(df[\"weight_kg\"] > 800) & (df[\"chilled\"])]\n\ntotals = (df.groupby(\"destination\")[\"weight_kg\"]\n            .sum()\n            .sort_values(ascending=False))", "note": "<b>Four statements, and every later week of this course is built on them.<\/b> The quality charts in Week 12 are these four. The reports in the project are these four."}, {"kind": "live", "mode": "four", "title": "Build the statements yourself, on the real table", "tasks": ["Change <code>&amp;<\/code> to <code>|<\/code>. The kept count goes <b>up<\/b> &mdash; say why in one sentence.", "Group by <code>booked_by<\/code> and switch <code>sum<\/code> to <code>count<\/code>. The numbers get much smaller &mdash; <b>what are they counting now?<\/b>", "Leave it on <code>sum<\/code>, then click through the three sorting choices. Which destination is on top each time?"]}, {"kind": "predict", "question": "The mistake that costs the most marks, all year. What happens?", "code": "df = pd.read_csv(\"shipments_export.csv\")\ndf[\"weight_kg\"] = pd.to_numeric(df[\"weight_kg\"], errors=\"coerce\")\ndf = df.dropna(subset=[\"weight_kg\"]).drop_duplicates(subset=[\"ref\"])\ndf[\"chilled\"] = df[\"chilled\"] == \"yes\"\n\nheavy = df[(df[\"weight_kg\"] > 800) and (df[\"chilled\"])]\nprint(heavy)", "options": ["an empty table", "ValueError: The truth value of a Series is ambiguous. Use a.empty, a.bool(), a.item(), a.any() or a.all().", "the two chilled shipments over 800 kg", "the whole table"], "explain": "<b><code>and<\/code> asks one yes-or-no question; a column is eight of them.<\/b> Python cannot boil a whole column down to a single yes, so it refuses. <code>&amp;<\/code> compares <b>row by row<\/b>, which is what you meant. Same for <code>|<\/code> instead of <code>or<\/code>. And <b>each condition needs its own brackets<\/b>, because <code>&amp;<\/code> binds tighter than <code>&gt;<\/code> does.", "answer": 1, "output": "ValueError: The truth value of a Series is ambiguous. Use a.empty, a.bool(), a.item(), a.any() or a.all()."}, {"kind": "fill", "title": "The four statements, on the cleaned table", "intro": "Five blanks. This is the shape of almost every pandas question you will ever be asked.", "code": "df[\"tonnes\"] = df[\"weight_kg\"] {{1}} 1000\n\nheavy = df[(df[\"weight_kg\"] > 800) {{2}} (df[\"chilled\"])]\n\ntotals = (df.groupby({{3}})[\"weight_kg\"]\n            .{{4}}()\n            .sort_values({{5}}))", "blanks": [{"n": 1, "answer": "/", "also": [], "reject": {}, "hint": "A kilogram is a thousandth of a tonne."}, {"n": 2, "answer": "&", "also": ["and"], "reject": {"and": "Not <code>and<\/code> — a column is not one yes-or-no. Use the single character that works row by row."}, "hint": "Both conditions, row by row."}, {"n": 3, "answer": "\"destination\"", "also": ["'destination'"], "reject": {}, "hint": "Group by the label column, in quotes."}, {"n": 4, "answer": "sum", "also": ["mean", "max"], "reject": {}, "hint": "Add the weights up within each destination."}, {"n": 5, "answer": "ascending=False", "also": ["ascending = False"], "reject": {}, "hint": "Biggest first is not what sorting does by default."}], "after": "<b>After a <code>groupby<\/code> you no longer have a table<\/b> — you have a Series, with <code>.index<\/code> holding the labels and <code>.values<\/code> holding the numbers. That is exactly what a bar chart wants, which is the next card.", "filled": "df[\"tonnes\"] = df[\"weight_kg\"] / 1000\n\nheavy = df[(df[\"weight_kg\"] > 800) & (df[\"chilled\"])]\n\ntotals = (df.groupby(\"destination\")[\"weight_kg\"]\n            .sum()\n            .sort_values(ascending=False))"}, {"kind": "fill", "title": "Putting it on a chart", "intro": "Five blanks, and the chart type is named by the question in words rather than by its function name. Here: <b>compare a few named destinations<\/b>.", "code": "fig, ax = plt.{{1}}()\nax.{{2}}(totals.index, totals.values)\nax.{{3}}(\"Total weight by destination\")\nax.{{4}}(\"Destination\")\nax.{{5}}(\"Kilograms\")", "blanks": [{"n": 1, "answer": "subplots", "also": [], "reject": {}, "hint": "One call makes both the figure and the axes, and it is plural."}, {"n": 2, "answer": "bar", "also": ["barh"], "reject": {}, "hint": "A handful of named things, side by side."}, {"n": 3, "answer": "set_title", "also": [], "reject": {}, "hint": "The heading above the chart."}, {"n": 4, "answer": "set_xlabel", "also": [], "reject": {}, "hint": "The horizontal axis carries the first argument."}, {"n": 5, "answer": "set_ylabel", "also": [], "reject": {}, "hint": "The vertical axis carries the numbers."}], "after": "<b>Every one of these is a method, so every one takes brackets.<\/b> <code>ax.set_title = \"...\"<\/code> with an equals sign replaces the method with a string, raises nothing at all, and your chart simply has no title. <b>Read the question for the verb:<\/b> <i>distributed<\/i> is a histogram, <i>over time<\/i> is a line, <i>compare<\/i> is a bar, <i>related<\/i> is a scatter.", "filled": "fig, ax = plt.subplots()\nax.bar(totals.index, totals.values)\nax.set_title(\"Total weight by destination\")\nax.set_xlabel(\"Destination\")\nax.set_ylabel(\"Kilograms\")"}, {"kind": "demo", "title": "Demo 2: three cleaning statements, then the four you already know", "code": "df = pd.read_csv(\"shipments_export.csv\")\n\ndf[\"weight_kg\"] = pd.to_numeric(df[\"weight_kg\"], errors=\"coerce\")  # text -> number\ndf = df.dropna(subset=[\"weight_kg\"])                               # no weight, no row\ndf = df.drop_duplicates(subset=[\"ref\"])                            # one row per shipment\ndf[\"chilled\"] = df[\"chilled\"] == \"yes\"                             # GIVEN: yes/no -> True/False\n\ndf[\"tonnes\"] = df[\"weight_kg\"] / 1000                              # a new column\n\nheavy  = df[(df[\"weight_kg\"] > 800) & (df[\"chilled\"])]             # a filter\n\ntotals = (df.groupby(\"destination\")[\"weight_kg\"]                   # group, add up,\n            .sum()\n            .sort_values(ascending=False))                         # biggest first\n\nprint(len(df), \"clean rows out of 12\")\nprint(heavy[[\"ref\", \"weight_kg\"]].to_string(index=False))\nprint(totals.to_string())", "points": ["<b>Twelve rows in, eight rows out<\/b>, and every row that left had a reason.", "<code>df[\"chilled\"] == \"yes\"<\/code> gives a whole column of True/False. <b>A comparison on a column is a column.<\/b>", "The <code>groupby<\/code> is split over three lines inside brackets only to fit. <b>It is one statement.<\/b>", "<b>This is the whole first hour in eleven lines.<\/b> Everything else today is objects."], "output": "8 clean rows out of 12\n  ref  weight_kg\nS-102     1350.0\nS-103      900.0\ndestination\nDibba       3180.0\nAl Ain      2140.0\nFujairah    1350.0"}]}, {"session": 1, "id": "P4", "short": "Your turn", "title": "Your turn, part 1", "cards": [{"kind": "yourturn", "minutes": 20, "notebook": "tutorial2_shipments.ipynb", "part": 1, "sub": "In Colab, in <code>tutorial2_shipments.ipynb<\/code>. Exercises <b>2.1 to 2.6<\/b> — read the export, fix it, and ask it the four questions. Each one ends with <code>check(...)<\/code>, which prints <b>PASS<\/b> or a hint naming the likely mistake.", "chat": "<b>2.6 is the one that matters<\/b> — it is the three statements wrapped into a function you can reuse all term. If you get stuck, type the exercise number in the chat."}, {"kind": "table", "title": "What part 1 was about", "rows": [["Reading a file and looking at it before touching it", "Where the export came from"], ["<code>to_numeric<\/code>, <code>dropna<\/code>, <code>drop_duplicates<\/code>", "Freight rates, tonnages, destinations"], ["Why a cleaning statement must be assigned back", "Anything about the logistics"], ["A new column, and a filter with <code>&amp;<\/code> or <code>|<\/code>", "Which columns a real system exports"], ["<code>groupby<\/code> + aggregate + <code>ascending=False<\/code>", "Database or file formats"], ["<code>subplots<\/code>, the chart type, and three labels", "Chart styling"]], "note": "<b>Break — ten minutes.<\/b> Part 2 takes the eight clean rows and asks a question you have not been asked before: <b>why would you turn a row into an object at all?<\/b>"}]}, {"session": 2, "id": "C1", "short": "Row to object", "title": "One row, one object", "cards": [{"kind": "idea", "tag": "IDEA", "title": "Why turn a row into an object?", "points": ["<b>A row is data.<\/b> It knows 420, <code>\"Al Ain\"<\/code>, <code>False<\/code> — and nothing else. To ask anything about it you write the question somewhere else, every time.", "<b>An object is data plus behaviour.<\/b> The same four values, and it can also answer <i>will you fit on this van?<\/i> — because the answer travels with the data.", "<b>The rule lives in one place.<\/b> Change what \"fits\" means and you change one method, not every place in your program that asked.", "<b>This is the whole argument for classes<\/b>, and it is why the rest of this course is objects rather than tables."], "code": "# a row: you ask the question from outside, every time\nif row.weight_kg <= 3000 - loaded:\n    ...\n\n# an object: the thing answers for itself\nif van.can_carry(shipment):\n    ...", "note": "<b>Neither is wrong.<\/b> Tables are better for <i>lots of rows at once<\/i> — that is Part 1. Objects are better for <i>one thing that behaves<\/i>. Real programs use both, and today you have written both on the same data."}, {"kind": "idea", "tag": "PYTHON", "title": "A class is a form; an object is a filled-in form", "points": ["<b>The class is written once.<\/b> It says what every shipment will remember, and nothing more.", "<b>An object is one real shipment<\/b>, with its own values. You can make eight from one class.", "<code>__init__<\/code> runs <b>once per object<\/b>, at the moment it is built. You never call it.", "<code>self<\/code> is <b>this particular object<\/b>. <code>self.ref = ref<\/code> means <i>write this value into me and keep it<\/i>."], "code": "class Shipment:\n    def __init__(self, ref, weight_kg):\n        self.ref = ref\n        self.weight_kg = weight_kg\n\ns = Shipment(\"S-101\", 420)\n\nprint(s.ref)          # S-101\nprint(s.weight_kg)    # 420", "note": "<b><code>self<\/code> is not magic and not a keyword.<\/b> It is the name of the first parameter, and Python fills it in for you with the object you called the method on."}, {"kind": "trace", "title": "Watch an object fill up, one line at a time", "code": "class Shipment:\n    def __init__(self, ref, weight_kg):\n        self.ref = ref\n        self.weight_kg = weight_kg\n\nboxes = []\nboxes.append(Shipment(\"S-101\", 420))\nboxes.append(Shipment(\"S-102\", 1350))\n\ntotal = 0\nfor box in boxes:\n    total += box.weight_kg\n\nprint(total, \"kg on the dock\")", "steps": [{"line": 1, "kind": "line", "note": "The class is only a <b>description<\/b>. Nothing has been built yet.", "g": {}, "fn": null, "loc": null, "out": ""}, {"line": 6, "kind": "line", "note": "An empty list, ready to hold objects.", "g": {}, "fn": null, "loc": null, "out": ""}, {"line": 7, "kind": "line", "note": "Building an object <b>runs <code>__init__<\/code><\/b>. Look below: <code>self<\/code> is a brand-new, <b>empty<\/b> <code>Shipment<\/code>, and the two values are waiting in its parameters.", "g": {}, "fn": "__init__", "loc": {"self": "Shipment()", "ref": "'S-101'", "weight_kg": "420"}, "out": ""}, {"line": 3, "kind": "line", "note": "Write the reference <b>into<\/b> the object. <code>self<\/code> has one attribute now.", "g": {}, "fn": "__init__", "loc": {"self": "Shipment(ref='S-101')", "ref": "'S-101'", "weight_kg": "420"}, "out": ""}, {"line": 4, "kind": "line", "note": "And the weight. The object remembers two things, and it is handed back.", "g": {}, "fn": "__init__", "loc": {"self": "Shipment(ref='S-101', weight_kg=420)", "ref": "'S-101'", "weight_kg": "420"}, "out": ""}, {"line": 4, "kind": "return", "note": "__init__() is finished. Back to the line that called it.", "g": {}, "fn": null, "loc": null, "out": ""}, {"line": 8, "kind": "line", "note": "A second object. <b>Same class, its own memory<\/b> — nothing is shared between them.", "g": {}, "fn": "__init__", "loc": {"self": "Shipment()", "ref": "'S-102'", "weight_kg": "1350"}, "out": ""}, {"line": 3, "kind": "line", "note": "Write the reference <b>into<\/b> the object. <code>self<\/code> has one attribute now.", "g": {}, "fn": "__init__", "loc": {"self": "Shipment(ref='S-102')", "ref": "'S-102'", "weight_kg": "1350"}, "out": ""}, {"line": 4, "kind": "line", "note": "And the weight. The object remembers two things, and it is handed back.", "g": {}, "fn": "__init__", "loc": {"self": "Shipment(ref='S-102', weight_kg=1350)", "ref": "'S-102'", "weight_kg": "1350"}, "out": ""}, {"line": 4, "kind": "return", "note": "__init__() is finished. Back to the line that called it.", "g": {}, "fn": null, "loc": null, "out": ""}, {"line": 10, "kind": "line", "note": "The running total starts at zero, <b>outside<\/b> the loop, or it would restart every time.", "g": {"total": "0"}, "fn": null, "loc": null, "out": ""}, {"line": 11, "kind": "line", "note": "Take the next object out of the list.", "g": {"total": "0", "box": "Shipment(ref='S-101', weight_kg=420)"}, "fn": null, "loc": null, "out": ""}, {"line": 12, "kind": "line", "note": "Reach into that object for one attribute and add it: <code>total<\/code> is now 420.", "g": {"total": "420", "box": "Shipment(ref='S-101', weight_kg=420)"}, "fn": null, "loc": null, "out": ""}, {"line": 11, "kind": "line", "note": "Take the next object out of the list.", "g": {"total": "420", "box": "Shipment(ref='S-102', weight_kg=1350)"}, "fn": null, "loc": null, "out": ""}, {"line": 12, "kind": "line", "note": "Reach into that object for one attribute and add it: <code>total<\/code> is now 1770.", "g": {"total": "1770", "box": "Shipment(ref='S-102', weight_kg=1350)"}, "fn": null, "loc": null, "out": ""}, {"line": 11, "kind": "line", "note": "No values left, so the loop ends.", "g": {"total": "1770", "box": "Shipment(ref='S-102', weight_kg=1350)"}, "fn": null, "loc": null, "out": ""}, {"line": 14, "kind": "line", "note": "1770 kg, added up from two objects that each knew their own weight.", "g": {"total": "1770", "box": "Shipment(ref='S-102', weight_kg=1350)"}, "fn": null, "loc": null, "out": "1770 kg on the dock\n"}, {"line": null, "kind": "end", "note": "Finished. The output box shows exactly what Python printed.", "g": {"total": "1770", "box": "Shipment(ref='S-102', weight_kg=1350)"}, "fn": null, "loc": null, "out": "1770 kg on the dock\n"}]}, {"kind": "predict", "question": "No <code>__str__<\/code>. What does <code>print(s)<\/code> show?", "code": "class Shipment:\n    def __init__(self, ref, weight_kg):\n        self.ref = ref\n        self.weight_kg = weight_kg\n\ns = Shipment(\"S-101\", 420)\n\nprint(s)", "options": ["Shipment", "TypeError: cannot print a Shipment", "<__main__.Shipment object at 0x...>", "S-101 420"], "explain": "<b>Python has no idea how you want your object written down<\/b>, so it falls back to the class name and a memory address. That is not an error — it is Python saying <i>you never told me<\/i>. Writing <code>__str__<\/code> is how you tell it. <span class='hint'>(The address differs every run; it is shortened here.)<\/span>", "answer": 2, "output": "<__main__.Shipment object at 0x...>"}, {"kind": "demo", "title": "Demo 3: one cleaned row becomes one object", "code": "class Shipment:\n    def __init__(self, ref, weight_kg, destination, chilled):\n        self.ref         = ref\n        self.weight_kg   = weight_kg\n        self.destination = destination\n        self.chilled     = chilled\n\n    def __str__(self):\n        return f\"{self.ref}: {self.weight_kg:.0f} kg to {self.destination}\"\n\nclass Vehicle:\n    def __init__(self, plate, capacity_kg):\n        self.plate       = plate\n        self.capacity_kg = capacity_kg\n        self.shipments   = []              # starts empty, and fills up\n\n    def load(self, shipment):              # a COMMAND: it changes the object\n        self.shipments.append(shipment)\n\n    def total_weight(self):                # a QUERY: it gives an answer back\n        total = 0\n        for shipment in self.shipments:\n            total += shipment.weight_kg\n        return total\n\n    def remaining_kg(self):\n        return self.capacity_kg - self.total_weight()\n\n    def can_carry(self, shipment):\n        return shipment.weight_kg <= self.remaining_kg()\n\n    def cost_per_km(self):\n        return 1.50\n\nboxes = []\nfor row in df.itertuples():                # GIVEN: one row at a time\n    boxes.append(Shipment(row.ref, row.weight_kg, row.destination, row.chilled))\n\nv = Vehicle(\"D-1024\", 3000)\nfor box in boxes[:3]:\n    v.load(box)\n\nprint(boxes[0])\nprint(\"on board:\", v.total_weight(), \"kg    room left:\", v.remaining_kg(), \"kg\")\nprint(\"will S-106 fit?\", v.can_carry(boxes[4]))", "points": ["<b>The loop at the bottom is the bridge.<\/b> <code>df.itertuples()<\/code> is <span class=\"tag GIVEN\">GIVEN<\/span> — what matters is that <b>one row makes one <code>Shipment<\/code><\/b>.", "<code>self.shipments = []<\/code> is <b>memory that starts empty and fills up<\/b> — the reason the vehicle is an object and not four loose variables.", "<code>load()<\/code> <b>changes<\/b> the vehicle and hands nothing back. <code>total_weight()<\/code> <b>hands an answer back<\/b> and changes nothing.", "<b>Inside <code>total_weight<\/code> there is no new Python at all:<\/b> a total set to zero, a <code>for<\/code>, a <code>+=<\/code>, a <code>return<\/code>. Tutorial 1, inside a method."], "output": "S-101: 420 kg to Al Ain\non board: 2670.0 kg    room left: 330.0 kg\nwill S-106 fit? False"}]}, {"session": 2, "id": "C2", "short": "A family", "title": "One parent, three children", "cards": [{"kind": "idea", "tag": "IDEA", "title": "A truck IS-A vehicle", "visual": "family", "points": ["<b>Write <code>class Truck(Vehicle):<\/code> and the truck already has<\/b> a plate, a capacity, a list of shipments, <code>load<\/code>, <code>total_weight<\/code>, <code>remaining_kg<\/code> and <code>can_carry<\/code>.", "The child adds <b>only what is different<\/b>. A van is a vehicle that costs less per kilometre — one method.", "<code>super().__init__(...)<\/code> means <i>let the parent set up its part first<\/i>, then the child adds its own.", "<b>A method written in the child with the same name wins.<\/b> That is overriding, and it is the whole of what a child class does."], "note": "<b>The test for inheritance is the sentence <i>a Truck IS-A Vehicle<\/i>.<\/b> If that sentence sounds wrong, inheritance is the wrong tool — and the last card of today is about the right one."}, {"kind": "demo", "title": "Demo 4: one parent, three children", "code": "class Truck(Vehicle):\n    def __init__(self, plate, capacity_kg, trailers):\n        super().__init__(plate, capacity_kg)   # the parent sets up the other three\n        self.trailers = trailers               # and this one is the child's own\n\n    def cost_per_km(self):                     # OVERRIDE: the child's own version\n        return 2.40 + 0.60 * self.trailers\n\nclass Van(Vehicle):\n    def cost_per_km(self):\n        return 0.90\n\nclass Reefer(Vehicle):\n    def cost_per_km(self):\n        return 3.10\n\n    def can_carry(self, shipment):             # stricter than the parent's rule\n        return super().can_carry(shipment) and shipment.chilled\n\nt = Truck(\"D-1024\", 3000, 1)\nt.load(boxes[0])                               # load() was never written here\n\nprint(t.plate, \"->\", t.total_weight(), \"kg,\", t.trailers, \"trailer\")\nprint(\"cost per km:\", round(t.cost_per_km(), 2))\nprint(\"a van costs:\", Van(\"V-201\", 800).cost_per_km())", "points": ["<b><code>load()<\/code> is never written here<\/b>, and the truck can still be loaded. One copy of the code, three classes using it.", "<code>Van<\/code> and <code>Reefer<\/code> have <b>no <code>__init__<\/code> at all<\/b>, so the parent's runs unchanged. Write one only when the child remembers something extra.", "<code>Reefer.can_carry<\/code> calls <code>super().can_carry(...)<\/code> <b>and then adds a condition<\/b> — the parent's rule plus one more, not a copy of it.", "<b>Three cost rules, no <code>if<\/code> anywhere.<\/b> Each class simply knows its own answer."], "output": "D-1024 -> 420.0 kg, 1 trailer\ncost per km: 3.0\na van costs: 0.9"}, {"kind": "predict", "question": "Three calls on two objects. What prints?", "code": "v = Van(\"V-201\", 800)\nt = Truck(\"D-1024\", 3000, 1)\n\nprint(v.cost_per_km())\nprint(t.cost_per_km())\nprint(v.remaining_kg())", "options": ["1.5\n3.0\n800", "0.9\n2.4\n800", "0.9\n3.0\n0", "0.9\n3.0\n800"], "explain": "<b>Python looks in the object's own class first.<\/b> <code>Van<\/code> has <code>cost_per_km<\/code>, so the parent's 1.50 is never reached. <code>remaining_kg<\/code> is <b>not<\/b> in <code>Van<\/code>, so Python goes up to <code>Vehicle<\/code> and finds it there — and with nothing loaded, the whole 800 kg is still free.", "answer": 3, "output": "0.9\n3.0\n800"}, {"kind": "error", "title": "The child that forgot its parent", "code": "class Truck(Vehicle):\n    def __init__(self, plate, capacity_kg, trailers):\n        self.trailers = trailers      # and nothing else\n\nt = Truck(\"D-1024\", 3000, 1)\nt.load(boxes[0])", "cause": "<b>Writing <code>__init__<\/code> in the child <i>replaces<\/i> the parent's; it does not add to it.<\/b> The truck never got its <code>self.shipments = []<\/code>, so the first attempt to load it fails — possibly hours later, in code that looks innocent. <b><code>super().__init__(plate, capacity_kg)<\/code> is the missing first line.<\/b>", "etype": "AttributeError", "ms const KW=new Set("def class return if elif else for in while and or not True False None import from as pass break continue try except print".split(" "));
const BI=new Set("len range min max sum int float str list dict type enumerate sorted round abs all any zip bool".split(" "));
function hl(line){
  let out=""; const re=/(#.*$)|(f?"(?:[^"\\]|\\.)*"|f?'(?:[^'\\]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|(\s+)|(.)/g; let m;
  while((m=re.exec(line))){
    if(m[1]) out+=`<span class="tk-com">${esc(m[1])}</span>`;
    else if(m[2]) out+=`<span class="tk-str">${esc(m[2])}</span>`;
    else if(m[3]) out+=`<span class="tk-num">${m[3]}</span>`;
    else if(m[4]){ const w=m[4]; out+= KW.has(w)?`<span class="tk-kw">${w}</span>`: BI.has(w)?`<span class="tk-fn">${w}</span>`: w; }
    else out+=esc(m[0]);
  }
  return out;
}
function codeHTML(src,opts={}){

}

/* ---------------- fill: a code block with typed blanks ---------------- */
function normAns(s){
  return String(s).trim()
    .replace(/[‘’“”]/g, '"').replace(/'/g, '"')
    .replace(/\s*([(),\[\]*/+=<>|&-])\s*/g, "$1")
    .replace(/\s+/g, " ").toLowerCase();
}
R.fill=(e,card)=>{
  const F=card.c, B=F.blanks, by={}; B.forEach(b=>by[b.n]=b);
  const parts=F.code.split(/\{\{(\d+)\}\}/);
  let html="", ln=1;
  const lineOpen=n=>`<span class="ln"><span class="no">${n}</span>`;
  html+=`<pre class="code fillcode">`;
  html+=lineOpen(ln);
  for(let i=0;i<parts.length;i++){
    if(i%2===0){
      const seg=parts[i].split("\n");
      seg.forEach((s,k)=>{ if(k) { html+=`</span>`; ln++; html+=lineOpen(ln); } html+= hl(s)||""; });
    } else {
      const n=+parts[i], b=by[n];
      html+=`<input class="bk" id="bk${n}" data-n="${n}" size="${Math.max(6,Math.min(30,b.answer.length+2))}" spellcheck="false" autocomplete="off" aria-label="blank ${n}"><span class="bn">${n}</span>`;
    }
  }
  html+=`</span></pre>`;
  e.innerHTML=head(card,esc(F.title),F.intro)+html+
   `<div class="row" style="margin-top:14px"><button class="btn primary" id="fc">Check</button>
     <button class="btn" id="fh">Hint for the first wrong one</button>
     <button class="btn" id="fa">Show the answers</button>
     <button class="btn" id="fr">Clear</button>
     ${F.minutes?`<button class="btn blue" id="ft">Start ${F.minutes}-minute timer</button>`:""}</div>
    <div class="fb" id="ff"></div><div class="reveal" id="fx"><div class="notebox">${F.after||""}</div></div>`;
  const ok=b=>{ const v=normAns($("#bk"+b.n).value); if(!v) return null;
    if(normAns(b.answer)===v) return true;
    if((b.also||[]).some(a=>normAns(a)===v)) return true;
    return false; };
  const paint=(res)=>{ B.forEach(b=>{ const el=$("#bk"+b.n);
    el.classList.toggle("good", res&&res[b.n]===true); el.classList.toggle("bad", res&&res[b.n]===false); }); };
  const score=()=>{ const res={}; B.forEach(b=>res[b.n]=ok(b)); return res; };
  let done=false;
  const check=()=>{ const res=score(); paint(res);
    const n=B.filter(b=>res[b.n]===true).length, blank=B.filter(b=>res[b.n]===null).length;
    $("#ff").innerHTML = n===B.length
      ? `<b style="color:var(--ok)">All ${n} right.</b>`
      : `<b style="color:var(--bad)">${n} of ${B.length} right</b>${blank?`, ${blank} still empty`:""}. Fix them one at a time.`;
    if(n===B.length){ $("#fx").classList.add("show"); done=true; }
    return n===B.length; };
  $("#fc").onclick=check;
  $("#fh").onclick=()=>{ const res=score();
    const b=B.find(x=>res[x.n]!==true);
    if(!b){ $("#ff").innerHTML=`<b style="color:var(--ok)">Nothing left to hint at.</b>`; return; }
    const v=normAns($("#bk"+b.n).value);
    let msg=b.hint||"";
    for(const k in (b.reject||{})) if(normAns(k)===v) msg=b.reject[k];
    $("#ff").innerHTML=`<b>Blank ${b.n}:</b> ${msg}`; };
  $("#fa").onclick=()=>{ B.forEach(b=>{ $("#bk"+b.n).value=b.answer; }); paint(score());
    $("#ff").innerHTML="The answers."; $("#fx").classList.add("show"); done=true; };
  $("#fr").onclick=()=>{ B.forEach(b=>{ const el=$("#bk"+b.n); el.value=""; el.className="bk"; });
    $("#ff").textContent=""; $("#fx").classList.remove("show"); };
  if(F.minutes) $("#ft").onclick=()=>startTimer(F.minutes);
  e.querySelectorAll(".bk").forEach((el,i,all)=>{ el.onkeydown=ev=>{
    if(ev.key==="Enter"){ ev.preventDefault(); if(i+1<all.length) all[i+1].focus(); else check(); } }; });
  return {advance(){ if(!done){ if(!check()){ $("#fa").click(); } return true; } return false; }};
};

  /* ===== 2. the cleaning toggles ===== */
  if(L.mode==="clean"){
    let on=[false,false,false];
    const STEP=['df["weight_kg"] = pd.to_numeric(df["weight_kg"], errors="coerce")',
                'df = df.dropna(subset=["weight_kg"])',
                'df = df.drop_duplicates(subset=["ref"])'];
    const LABEL=["to_numeric", "dropna", "drop_duplicates"];
    box.innerHTML=`<div class="panelbox">
        <div id="tg"></div>

             {c:'df["destination"] == "Al Ain"', s:'destination == "Al Ain"', f:r=>r.destination==="Al Ain"}];
    const J=[{s:"&", f:(x,y)=>x&&y, w:"<code>&amp;</code> keeps a row only if <b>both</b> sides are true of it."},
             {s:"|", f:(x,y)=>x||y, w:"<code>|</code> keeps a row if <b>either</b> side is true of it, so the count can only go up."}];
    const G=["destination","booked_by","chilled"];
    const AG=[{n:"sum",  w:"adds the weights up inside each group."},
              {n:"mean", w:"averages them inside each group &mdash; so a group of one sits at its own weight."},
              {n:"count",w:"counts the <b>rows</b> in each group. Nothing here is in kilograms any more."},
              {n:"max",  w:"the single heaviest shipment in each group."}];
    const SO=[{c:"",                              s:"(not sorted)",
               w:"with no sorting you get the groups in <b>alphabetical</b> order, which is almost never the order you want."},
              {c:".sort_values()",                s:".sort_values()",
               w:"the default is <b>smallest first</b>."},
              {c:".sort_values(ascending=False)", s:".sort_values(ascending=False)",
               w:"<b>biggest first</b>, and this is the one everybody forgets."}];
    const D={tn:false, a:0, j:0, b:0, g:0, ag:0, so:2};
    let s={...D};
    const num=v=>String(Math.round(v*1000)/1000);
    const py=v=>v?"True":"False";          // Python spells its booleans with a capital letter
    const tok=(k,label)=>`<button class="tok" data-k="${k}">${esc(label)}</button>`;

    box.innerHTML=`<div class="panelbox">
        <div class="cap">1 &middot; a new column</div>
        <label class="stoprow"><input type="checkbox" id="tn"><span><code>df["tonnes"] = df["weight_kg"] / 1000</code></span></label>
        <div class="cap">2 &middot; a filter</div>
        <div class="expr" id="e1"></div>
        <div class="cap">3 &middot; group, aggregate, then sort</div>
        <div class="expr" id="e2"></div>
        <div class="stepinfo" id="fs" style="margin:10px 0 6px"></div>
        <div id="fw" style="overflow-x:auto"></div></div>`;
    $("#lc").insertAdjacentHTML("afterend", '<div id="fout"></div>');

    const draw=()=>{
      const a=A[s.a], b=B[s.b], j=J[s.j], g=G[s.g], ag=AG[s.ag], so=SO[s.so];
      $("#tn").checked=s.tn;
      $("#e1").innerHTML=`<span class="lit">heavy = df[(</span>${tok("a",a.s)}<span class="lit">)&nbsp;</span>`+
        `${tok("j",j.s)}<span class="lit">&nbsp;(</span>${tok("b",b.s)}<span class="lit">)]</span>`;
      $("#e2").innerHTML=`<span class="lit">totals = df.groupby(</span>${tok("g",'"'+g+'"')}`+
        `<span class="lit">)["weight_kg"].</span>${tok("ag",ag.n)}<span class="lit">()</span>`+
        `<br><span class="lit cont">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>${tok("so",so.s||"(not sorted)")}`;

      /* the filter */
      const hit=new Map(CL.map(r=>[r.ref, j.f(a.f(r), b.f(r))]));
      const kept=CL.filter(r=>hit.get(r.ref));

      /* the groupby */
      const key=r=> g==="chilled" ? py(r.chilled) : r[g];
      const bag=new Map();
      CL.forEach(r=>{ const k=key(r); if(!bag.has(k)) bag.set(k,[]); bag.get(k).push(r.weight_kg); });
      let rows=[...bag.entries()].map(([k,v])=>[k,
        ag.n==="sum" ? v.reduce((x,y)=>x+y,0) : ag.n==="mean" ? v.reduce((x,y)=>x+y,0)/v.length :
        ag.n==="count" ? v.length : Math.max(...v)]);
      rows.sort((x,y)=>String(x[0])<String(y[0])?-1:1);                    // groupby sorts its keys
      if(so.c===".sort_values()")                rows.sort((x,y)=>x[1]-y[1]);
      if(so.c===".sort_values(ascending=False)") rows.sort((x,y)=>y[1]-x[1]);
      const val=v=> ag.n==="count" ? String(v) : v.toFixed(1);

      $("#fs").innerHTML=`<b>8 rows</b> &nbsp;&middot;&nbsp; <code>heavy</code> keeps <b>${kept.length}</b>`+
        ` &nbsp;&middot;&nbsp; <code>totals</code> has <b>${rows.length}</b> groups`;

      const CS=["ref","destination","weight_kg"].concat(s.tn?["tonnes"]:[]).concat(["chilled","booked_by"]);
      let h=`<table class="raw"><thead><tr><th class="n"></th>${CS.map(c=>
        `<th${c==="tonnes"?' class="sel"':""}>${c}</th>`).join("")}<th>heavy</th></tr></thead><tbody>`;
      CL.forEach((r,i)=>{ const on=hit.get(r.ref);
        h+=`<tr class="${on?"hit":""}"><td class="n">${i}</td>`+CS.map(c=>
          `<td${c==="tonnes"?' class="sel"':""}>${c==="tonnes"?num(r.weight_kg/1000):
            c==="chilled"?py(r.chilled):c==="weight_kg"?r.weight_kg.toFixed(1):esc(r[c])}</td>`).join("")+
          `<td class="keep">${on?"kept":""}</td></tr>`; });
      $("#fw").innerHTML=h+`</tbody></table>`;

      const chain=`totals = (df.groupby("${g}")["weight_kg"]\n            .${ag.n}()`+
                  (so.c?`\n            ${so.c})`:")");
      $("#lc").innerHTML=`<span class="cm"># df is the clean table Part 1 left behind: 8 rows</span>
${s.tn?hl('df["tonnes"] = df["weight_kg"] / 1000'):'<span class="cm"># df["tonnes"] = df["weight_kg"] / 1000</span>'}

${hl(`heavy = df[(${a.c}) ${j.s} (${b.c})]`)}
${hl(chain)}

${hl("len(heavy)")}        <span class="res">${kept.length}</span>
${hl('heavy["ref"].tolist()')}   <span class="res">[${kept.map(r=>"'"+r.ref+"'").join(", ")}]</span>
${hl("len(totals)")}       <span class="res">${rows.length}</span>`;

      $("#fout").innerHTML=`<div class="clsbox"><div class="hd">totals</div>
        <table class="ser"><tbody>${rows.map(([k,v])=>
          `<tr><td>${esc(k)}</td><td class="v">${val(v)}</td></tr>`).join("")}
          <tr class="dt"><td colspan="2">Name: weight_kg, dtype: ${ag.n==="count"?"int64":"float64"}</td></tr>
        </tbody></table></div>
        <div class="notebox" style="margin-top:8px">
          <div class="wline"><code>${esc(j.s)}</code><span>${j.w.replace(/^<code>[^<]*<\/code> /,"")}</span></div>
          <div class="wline"><code>${ag.n}</code><span>${ag.w}</span></div>
          <div class="wline"><code>sort</code><span>${so.w}</span></div></div>`;

      box.querySelectorAll(".tok").forEach(t=>t.onclick=()=>{
        const k=t.dataset.k, n={a:A.length, b:B.length, j:J.length, g:G.length, ag:AG.length, so:SO.length}[k];
        s[k]=(s[k]+1)%n; draw(); });
    };
    $("#tn").onchange=()=>{ s.tn=$("#tn").checked; draw(); };
    $("#rs").onclick=()=>{ s={...D}; draw(); };
    draw(); return;
  }

  /* ===== 4. where does this method come from? ===== */
  if(L.mode==="fleet"){
    const CLS=["Van","Truck","Reefer"];
    const OWN={Van:["cost_per_km"],Truck:["__init__","cost_per_km"],Reefer:["cost_per_km","can_carry"]};
    const PARENT=["__init__","load","total_weight","remaining_kg","can_carry","cost_per_km"];
    const METH=["cost_per_km","remaining_kg","total_weight","can_carry","load"];
    const CALL={Van:'v = Van("V-201", 800)',Truck:'v = Truck("D-1024", 3000, 1)',Reefer:'v = Reefer("R-330", 2000)'};
    const ARG={can_carry:'box',load:'box'};
    const RESULT={
      Van:{cost_per_km:"0.9",remaining_kg:"800",total_weight:"0",can_carry:"True",load:"None   (it changes the object)"},
      Truck:{cost_per_km:"3.0",remaining_kg:"3000",total_weight:"0",can_carry:"True",load:"None   (it changes the object)"},
      Reefer:{cost_per_km:"3.1",remaining_kg:"2000",total_weight:"0",can_carry:"False  (420 kg fits, but it is not chilled)",load:"None   (it changes the object)"}};
    let cls="Van", meth="cost_per_km";
    box.innerHTML=`<div class="panelbox">
        <div class="cap">the object you built</div>
        <div class="pick" id="pc">${CLS.map(c=>`<button data-c="${c}">${c}</button>`).join("")}</div>
        <div class="cap">the method you called</div>
        <div class="pick" id="pm">${METH.map(m=>`<button data-m="${m}">${m}()</button>`).join("")}</div>
        <div id="lookup" style="margin-top:10px"></div></div>`;
    const draw=()=>{
      box.querySelectorAll("#pc button").forEach(b=>b.classList.toggle("on",b.dataset.c===cls));
      box.querySelectorAll("#pm button").forEach(b=>b.classList.toggle("on",b.dataset.m===meth));
      const inChild=OWN[cls].includes(meth), sup=(cls==="Reefer"&&meth==="can_carry");
      const childML=OWN[cls].map(m=>m===meth?`<b>def ${m}(self, ...)</b>`:`def ${m}(self, ...)`).join("<br>");
      const parML=PARENT.map(m=>(!inChild&&m===meth)||(sup&&m===meth)?`<b>def ${m}(self, ...)</b>`:`def ${m}(self, ...)`).join("<br>");
      $("#lookup").innerHTML=
        `<div class="clsbox ${inChild?"found":"looked"}"><div class="hd">class ${cls}(Vehicle)`+
        `<span style="float:right;font-weight:600;font-size:.8rem;color:var(--ink-3)">${inChild?"found here":"not here — look up"}</span></div>`+
        `<div class="ml">${childML||"(nothing of its own)"}</div></div>`+
        `<div class="updown">${inChild&&!sup?"&nbsp;":"&#8595;"}</div>`+
        `<div class="clsbox ${(!inChild||sup)?"found":""}"><div class="hd">class Vehicle`+
        `<span style="float:right;font-weight:600;font-size:.8rem;color:var(--ink-3)">${inChild?(sup?"and then asked with super()":"never reached"):"found here"}</span></div>`+
        `<div class="ml">${parML}</div></div>`;
      const walk = inChild ? (sup ? `# found in ${cls}, which then calls\n# super().can_carry(...) as well`
                                  : `# found in ${cls}\n# Vehicle is never even looked at`)
                           : `# not in ${cls}\n# so Python goes up to Vehicle, and finds it there`;
      $("#lc").innerHTML=`<span class="cm"># a 420 kg shipment, not chilled</span>
${hl('box = Shipment("S-101", 420, "Al Ain", False)')}
${hl(CALL[cls])}
${hl("v."+meth+"("+(ARG[meth]||"")+")")}

<span class="cm">${esc(walk)}</span>

<span class="res">-&gt; ${esc(RESULT[cls][meth])}</span>`;
    };
    box.querySelectorAll("#pc button").forEach(b=>b.onclick=()=>{cls=b.dataset.c; draw();});
    box.querySelectorAll("#pm button").forEach(b=>b.onclick=()=>{meth=b.dataset.m; draw();});
    $("#rs").onclick=()=>{cls="Van"; meth="cost_per_km"; draw();};
    draw(); return;
  }
}
/* ---------------- navigation ---------------- */
const chips=$("#chips");
let ch=`<button class="chip" data-t="welcome"><b>T2</b> Start</button>`;
[1,2].forEach(s=>{ ch+=`<button class="chip sep" data-t="s${s}">&#9656; Part ${s}</button>`;
  DATA.blocks.filter(b=>b.session===s).forEach(b=>ch+=`<button class="chip" data-t="${b.id}">${esc(b.short)}</button>`); });
ch+=`<button class="chip" data-t="summary">Summary</button>`;
chips.innerHTML=ch;
chips.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ const t=c.dataset.t;
  const i=CARDS.findIndex(x=> t==="welcome"?x.type==="welcome": t==="summary"?x.type==="summary":
    (t[0]==="s"&&t.length===2)?(x.type==="session"&&x.session===+t[1]): (x.block&&x.block.id===t)); go(i); });
function go(i){
  if(window.LIVE_STOP){ LIVE_STOP(); window.LIVE_STOP=null; }
  cur=Math.max(0,Math.min(CARDS.length-1,i)); const c=CARDS[cur];
  $("#stage").innerHTML=`<article class="card" id="card"></article>`;
  ctl=R[c.type]($("#card"),c)||{};
  const key=c.type==="welcome"?"welcome":c.type==="summary"?"summary":c.type==="session"?"s"+c.session:c.block.id;
  chips.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.t===key));
  const on=chips.querySelector(".chip.on"); if(on) on.scrollIntoView({block:"nearest",inline:"nearest"});
  if(c.block){ const inB=CARDS.filter(x=>x.block===c.block); $("#where").textContent=`Part ${c.session} · ${c.block.short} · ${c.label} · ${inB.indexOf(c)+1} of ${inB.length}`; }
  else $("#where").textContent=c.label;
  $("#prog").style.width=(cur/(CARDS.length-1)*100)+"%";
  $("#prevBtn").disabled=cur===0; $("#nextBtn").disabled=cur===CARDS.length-1;
  history.replaceState(null,"","#"+cur); window.scrollTo(0,0);
}
function next(){ if(ctl.advance&&ctl.advance()) return; if(cur<CARDS.length-1) go(cur+1); }
function prev(){ if(ctl.back&&ctl.back()) return; if(cur>0) go(cur-1); }
$("#nextBtn").onclick=()=>{ if(cur<CARDS.length-1) go(cur+1); };
$("#prevBtn").onclick=()=>{ if(cur>0) go(cur-1); };
document.addEventListener("keydown",ev=>{ if(ev.target.matches("input,textarea,select")) return;
  if(ev.key==="ArrowRight"||ev.key==="PageDown"){ ev.preventDefault(); next(); }
  if(ev.key==="ArrowLeft"||ev.key==="PageUp"){ ev.preventDefault(); prev(); } });
go(parseInt(location.hash.slice(1))||0);
</script>
